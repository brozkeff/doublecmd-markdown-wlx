[package]
name = "markdown-wlx"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
license = "EUPL-1.2"
build = "build.rs"

[lib]
name = "markdown_wlx_qt5"
crate-type = ["cdylib"]

[dependencies]
libc = "0.2"
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }

[build-dependencies]
cc = "1.2"
pkg-config = "0.3"

[features]
render-bench = []

[[bin]]
name = "render-bench"
path = "src/bin/render_bench.rs"
required-features = ["render-bench"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = "debuginfo"
